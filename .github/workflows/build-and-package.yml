name: Build and Package libllm

on:
  push:
    tags:
      - "v*" # 推送 v1.0.0 之类的标签时触发
  workflow_dispatch:
    # 允许手动触发

jobs:
  # ================================
  #  Linux 多架构构建 (amd64, i386, arm64)
  # ================================
  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ amd64, i386, arm64 ]
        include:
          - arch: amd64
            container: ubuntu:22.04
            cmake_extra: ""
          - arch: i386
            container: i386/ubuntu:22.04
            cmake_extra: ""
          - arch: arm64
            container: arm64v8/ubuntu:22.04
            cmake_extra: ""
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
          cmake build-essential \
          pkg-config \
          libcurl4-openssl-dev \
          libcjson-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare package directory
        run: |
          mkdir -p package/usr/local/lib
          cp build/libllm.so package/usr/local/lib/

      - name: Build .deb and .rpm with CPack
        run: |
          cd build
          cpack -G DEB -D CPACK_DEBIAN_PACKAGE_ARCHITECTURE=${{ matrix.arch }}
          cpack -G RPM -D CPACK_RPM_PACKAGE_ARCHITECTURE=${{ matrix.arch }}
          cd ..
          mv build/*.deb build/*.rpm ./

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            *.deb
            *.rpm
            build/libllm.so

  # ================================
  #  Windows 构建 (x64 DLL)
  # ================================
  build-windows:
    name: Windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 启用 vcpkg 并安装 curl 和 cjson
      - name: Install vcpkg dependencies
        run: |
          vcpkg install curl:x64-windows cjson:x64-windows

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: build/Release/libllm.dll
