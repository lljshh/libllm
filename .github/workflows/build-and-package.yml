name: Build and Package libllm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux-amd64:
    name: Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config \
            libcurl4-openssl-dev libcjson-dev rpm rpm-build
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Strip debug symbols
        run: |
          if [ -f build/libllm.so ]; then
            strip --strip-unneeded build/libllm.so
          fi
      - name: Package with CPack
        run: |
          cd build
          cpack -G DEB -D CPACK_DEBIAN_PACKAGE_ARCHITECTURE=amd64
          cpack -G RPM -D CPACK_RPM_PACKAGE_ARCHITECTURE=x86_64
          mv *.deb *.rpm ..
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            *.deb
            *.rpm
            build/libllm.so
          if-no-files-found: error

  build-linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config \
            libcurl4-openssl-dev libcjson-dev rpm rpm-build
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Strip debug symbols
        run: |
          if [ -f build/libllm.so ]; then
            strip --strip-unneeded build/libllm.so
          fi
      - name: Package with CPack
        run: |
          cd build
          cpack -G DEB -D CPACK_DEBIAN_PACKAGE_ARCHITECTURE=arm64
          cpack -G RPM -D CPACK_RPM_PACKAGE_ARCHITECTURE=aarch64
          mv *.deb *.rpm ..
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            *.deb
            *.rpm
            build/libllm.so
          if-no-files-found: error

  build-windows:
    name: Windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install vcpkg dependencies
        run: |
          vcpkg install curl:x64-windows cjson:x64-windows
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure CMake
        run: |
          cmake -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DVCPKG_TARGET_TRIPLET=x64-windows
        shell: pwsh
      - name: Build
        run: cmake --build build --config Release --parallel
        shell: pwsh
      - name: Install to temporary directory
        run: cmake --install build --config Release --prefix install_dir
        shell: pwsh
      - name: Create ZIP package
        run: |
          Compress-Archive -Path install_dir\* -DestinationPath libllm-windows-amd64.zip
        shell: pwsh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: libllm-windows-amd64.zip
          if-no-files-found: error
