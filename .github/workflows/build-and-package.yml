name: Build and Package libllm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux-amd64:
    name: Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config \
            libcurl4-openssl-dev libcjson-dev rpm
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Strip debug symbols
        run: |
          if [ -f build/libllm.so ]; then
            strip --strip-unneeded build/libllm.so
          fi
      - name: Package with CPack
        run: |
          cd build
          cpack -G DEB -D CPACK_DEBIAN_PACKAGE_ARCHITECTURE=amd64
          cpack -G RPM -D CPACK_RPM_PACKAGE_ARCHITECTURE=x86_64
          mv *.deb *.rpm ..
      - name: Rename packages with architecture
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          # 重命名 .deb
          for f in *.deb; do
            mv "$f" "libllm-${VERSION}-amd64.deb"
          done
          # 重命名 .rpm
          for f in *.rpm; do
            mv "$f" "libllm-${VERSION}-x86_64.rpm"
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            libllm-*.deb
            libllm-*.rpm
          if-no-files-found: error

  build-linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config \
            libcurl4-openssl-dev libcjson-dev rpm
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Strip debug symbols
        run: |
          if [ -f build/libllm.so ]; then
            strip --strip-unneeded build/libllm.so
          fi
      - name: Package with CPack
        run: |
          cd build
          cpack -G DEB -D CPACK_DEBIAN_PACKAGE_ARCHITECTURE=arm64
          cpack -G RPM -D CPACK_RPM_PACKAGE_ARCHITECTURE=aarch64
          mv *.deb *.rpm ..
      - name: Rename packages with architecture
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          for f in *.deb; do
            mv "$f" "libllm-${VERSION}-arm64.deb"
          done
          for f in *.rpm; do
            mv "$f" "libllm-${VERSION}-aarch64.rpm"
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            libllm-*.deb
            libllm-*.rpm
          if-no-files-found: error

  build-windows-mingw:
    name: Windows amd64 (MinGW)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-cjson
      - name: Configure CMake (MinGW)
        shell: msys2 {0}
        run: |
          cmake -B build \
            -G "MinGW Makefiles" \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_STANDARD=11 \
            -DCMAKE_C_STANDARD_REQUIRED=ON
      - name: Build
        shell: msys2 {0}
        run: cmake --build build -j$(nproc)
      - name: Strip debug symbols
        shell: msys2 {0}
        run: |
          if [ -f build/libllm.dll ]; then
            strip --strip-unneeded build/libllm.dll
          fi
          if [ -f build/libllm.a ]; then
            strip --strip-unneeded build/libllm.a
          fi
      - name: Install to prefix
        shell: msys2 {0}
        run: cmake --install build --prefix install_dir
      - name: Create ZIP package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path install_dir\* -DestinationPath "libllm-${version}-windows-mingw-amd64.zip"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-mingw-amd64
          path: libllm-*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux-amd64, build-linux-arm64, build-windows-mingw]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Display structure of downloaded files
        run: ls -R artifacts
      - name: Create Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/linux-amd64/*.deb
            artifacts/linux-amd64/*.rpm
            artifacts/linux-arm64/*.deb
            artifacts/linux-arm64/*.rpm
            artifacts/windows-mingw-amd64/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
